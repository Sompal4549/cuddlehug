name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze, test, APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cuddlehug_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit + widget tests
        run: flutter test

      - name: Build dev APK (flavor check)
        run: flutter build apk --debug --flavor dev --dart-define-from-file=config/dev.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cuddlehug-dev-apk
          path: cuddlehug_app/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7

  ios:
    name: iOS build (no codesign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cuddlehug_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Compiles every platform channel plugin + Swift code without needing
      # signing certificates — enough to catch iOS build breakage.
      - name: Build iOS
        run: flutter build ios --debug --no-codesign

  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cuddlehug_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cuddlehug_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cuddlehug_test?schema=public
      NODE_ENV: test
      RAZORPAY_WEBHOOK_SECRET: test_webhook_secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_STORE_NAME: CuddleHug
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
